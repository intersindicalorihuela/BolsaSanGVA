name: Actualizar bolsa

on:
  push:
    paths:
      - 'data/bolsa.xls'
      - 'data/bolsa.xlsx'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install xlsx@0.18.5

      - name: Generar index.html a partir del Excel
        run: |
          if [ -f data/bolsa.xlsx ]; then EXCEL=data/bolsa.xlsx; else EXCEL=data/bolsa.xls; fi
          node scripts/build-index.js "$EXCEL" index.html

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Actualiza datos de la bolsa ($(date +%F))"
          git push
